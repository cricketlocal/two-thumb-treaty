# Render Blueprint — static site
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: two-thumb-treaty
    runtime: static
    plan: free
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=300
